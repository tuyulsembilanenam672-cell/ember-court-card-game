<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ember Court — an original duel card game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100a; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; touch-action: none; box-shadow: 0 0 60px #000; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="Ember Court: an elemental duel card game. Play cards, outwit the Ashen Rival, and bring their life to zero."></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!-- Ember Court: 100% offline. No scripts, fonts, images or sounds load from the
     network; all art is drawn on the canvas and all sound is synthesized. -->
